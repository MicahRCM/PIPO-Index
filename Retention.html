<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Retention Trends</title>
    <link rel="shortcut icon" type="image/jpg" href="./assets/bullet_logo.png" />
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.3/css/all.css" integrity="sha384-UHRtZLI+pbxtHCWp1t77Bi1L4ZtiqrqD80Kn4Z8NTSRyMA2Fd33n5dQ8lWUE00s/" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.3.1.min.js" integrity="sha256-FgpCb/KJQlLNfOu91ta32o/NMZxltwRo8QtmkMRdAu8=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@2.9.3"></script>
    <link rel="stylesheet" type="text/css" href="./css/Retention.css">
</head>

<body>
    <div id="nav-placeholder" style="height: 100px;"> </div>
    <div class="mainContainer">
        <h1 class="pageTitle"> Retention Trends </h1>
        <h3 class="pageSubtitle"> First-to-second-year full-time retention rate, 2016&ndash;2024 (IPEDS via College Scorecard) </h3>

        <div class="chartContainer">
            <div class="chartHeader">
                <span class="chartLegendNote" id="selectionCount"> Pick universities from the list to compare. </span>
                <span class="chartActions">
                    <button class="actionBtn" id="clearBtn"> Clear </button>
                </span>
            </div>
            <div class="chartWrapper">
                <canvas id="retentionChart"></canvas>
            </div>
        </div>

        <div class="chartSearchContainer">
            <input type="text" id="uniSearch" placeholder="Search universities..">
            <div id="uniList" class="uniList">
                <div class="loadingMsg"> Loading universities&hellip; </div>
            </div>
        </div>
    </div>
    <script type="text/javascript" src="./assets/retention_history.js"></script>
    <script type="text/javascript" src="./js/Retention.js"></script>
</body>

</html>
